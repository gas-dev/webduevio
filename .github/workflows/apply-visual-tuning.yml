name: Apply Duevio visual tuning

on:
  push:
    paths:
      - 'visual-tuning.ready'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Link visual tuning stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('index.template.html')] + [Path(x)/'index.html' for x in ['it','de','es','fr','ru']]
          for p in files:
              text = p.read_text(encoding='utf-8')
              if 'test-alignment.css' in text:
                  continue
              old = 'styles.css"'
              if old not in text:
                  raise SystemExit(f'Unable to find styles.css in {p}')
              text = text.replace(old, 'styles.css"', 1)
              import re
              m = re.search(r'<link[^>]+href="([^"]*styles\.css)"[^>]*>', text)
              if not m:
                  raise SystemExit(f'Unable to locate stylesheet link in {p}')
              href = m.group(1).replace('styles.css','test-alignment.css')
              insert = m.group(0) + f'\n  <link rel="stylesheet" href="{href}">'
              text = text[:m.start()] + insert + text[m.end():]
              p.write_text(text, encoding='utf-8')
          PY
          rm -f visual-tuning.ready
          rm -f .github/workflows/apply-visual-tuning.yml
      - name: Commit visual tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Duevio Site Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply visual alignment with Duevio test site"
          git push
