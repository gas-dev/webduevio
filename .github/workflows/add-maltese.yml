name: Add Maltese language

on:
  push:
    paths:
      - 'maltese.ready'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Maltese locale and language UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          en_path = root/'assets/i18n/en.json'
          mt_path = root/'assets/i18n/mt.json'
          en = json.loads(en_path.read_text(encoding='utf-8'))
          mt = json.loads(mt_path.read_text(encoding='utf-8'))
          merged = {k: mt.get(k, v) for k, v in en.items()}
          mt_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          source = (root/'it/index.html').read_text(encoding='utf-8')
          page = source
          page = re.sub(r'<html lang="it" data-lang="it"', '<html lang="mt" data-lang="mt"', page, count=1)
          page = page.replace('https://test.duevio.com/it/', 'https://test.duevio.com/mt/')
          page = re.sub(r'<title>.*?</title>', '<title>Duevio | Operazzjonijiet AML mill-onboarding sal-awditjar</title>', page, count=1, flags=re.S)
          page = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Immaniġġja KYC, fajls tal-klijenti, sjieda, reviżjonijiet, workflows u evidenza ta’ awditjar f’workspace AML wieħed.">', page, count=1)
          page = re.sub(r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Duevio | Operazzjonijiet AML mill-onboarding sal-awditjar">', page, count=1)
          page = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Workspace AML internazzjonali għal onboarding, KYC, reviżjonijiet, workflow u evidenza.">', page, count=1)

          mt_dir = root/'mt'
          mt_dir.mkdir(exist_ok=True)
          (mt_dir/'index.html').write_text(page, encoding='utf-8')

          html_files = [root/'index.html'] + [root/x/'index.html' for x in ['it','mt','de','es','fr','ru']]
          for p in html_files:
            text = p.read_text(encoding='utf-8')
            if 'hreflang="mt"' not in text:
              marker = '<link rel="alternate" hreflang="ru" href="https://test.duevio.com/ru/">'
              if marker in text:
                text = text.replace(marker, marker + '\n  <link rel="alternate" hreflang="mt" href="https://test.duevio.com/mt/">')
              else:
                marker2 = '<link href="https://test.duevio.com/ru/" hreflang="ru" rel="alternate"/>'
                text = text.replace(marker2, marker2 + '\n<link href="https://test.duevio.com/mt/" hreflang="mt" rel="alternate"/>')
            if 'assets/js/lang-ui.js' not in text:
              if p.parent == root:
                text = text.replace('<script src="assets/js/app.js" defer></script>', '<script src="assets/js/app.js" defer></script>\n  <script src="assets/js/lang-ui.js" defer></script>')
              else:
                text = text.replace('<script defer="" src="../assets/js/app.js"></script>', '<script defer="" src="../assets/js/app.js"></script>\n<script defer="" src="../assets/js/lang-ui.js"></script>')
                text = text.replace('<script src="../assets/js/app.js" defer></script>', '<script src="../assets/js/app.js" defer></script>\n  <script src="../assets/js/lang-ui.js" defer></script>')
            p.write_text(text, encoding='utf-8')

          app = (root/'assets/js/app.js').read_text(encoding='utf-8')
          if 'mt: {' not in app:
            needle = "    ru: {\n"
            mtblock = "    mt: {\n      invalid: 'Jekk jogħġbok imla l-oqsma obbligatorji kollha u ċċekkja li l-passwords jaqblu.',\n      signupOk: 'Il-preview ġiet ivvalidata. Il-checkout tal-produzzjoni għadu mhux konness f’dan ir-repository.',\n      demoOk: 'Il-preview ġiet ivvalidata. L-endpoint tal-produzzjoni għat-talbiet tad-demo għadu mhux konness f’dan ir-repository.',\n      contact: 'Ikkuntattjana',\n      users: 'Setup miftiehem',\n      requestSetup: 'Itlob setup',\n      commercialOk: 'Il-preview ġiet ivvalidata. Il-follow-up kummerċjali tal-produzzjoni għadu mhux konness f’dan ir-repository.',\n      next2Title: 'Follow-up kummerċjali',\n      next2Text: 'Nirrevedu miegħek il-pjan magħżul, id-daqs tat-tim u l-ħtiġijiet ta’ implementazzjoni.',\n      next3Title: 'Triq ta’ implementazzjoni',\n      next3Text: 'Naqblu fuq setup, appoġġ għall-onboarding u prijoritajiet ta’ integrazzjoni qabel l-attivazzjoni.'\n    },\n"
            app = app.replace(needle, mtblock + needle, 1)
          (root/'assets/js/app.js').write_text(app, encoding='utf-8')

          cssp = root/'assets/css/global-design.css'
          css = cssp.read_text(encoding='utf-8')
          flag_css = '''\n/* International language selector */\n.language-menu a{display:flex!important;align-items:center;gap:9px}\n.lang-flag{font-size:17px;line-height:1;flex:0 0 22px}\n.language-button .language-code{min-width:48px;text-align:left}\n'''
          if 'International language selector' not in css:
            cssp.write_text(css + flag_css, encoding='utf-8')

          sitemap = root/'sitemap.xml'
          sm = sitemap.read_text(encoding='utf-8')
          if 'https://test.duevio.com/mt/' not in sm:
            sm = sm.replace('</urlset>', '  <url><loc>https://test.duevio.com/mt/</loc></url>\n</urlset>')
            sitemap.write_text(sm, encoding='utf-8')

          Path('maltese.ready').unlink(missing_ok=True)
          PY
      - name: Validate locale files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          en=json.loads(Path('assets/i18n/en.json').read_text())
          mt=json.loads(Path('assets/i18n/mt.json').read_text())
          assert set(en)==set(mt), (len(en),len(mt),len(set(en)-set(mt)))
          assert Path('mt/index.html').exists()
          assert 'data-lang="mt"' in Path('mt/index.html').read_text()
          print('Maltese keys:', len(mt))
          PY
      - name: Commit Maltese localization
        run: |
          git config user.name "Duevio Site Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Maltese localization and language flags"
          git push
