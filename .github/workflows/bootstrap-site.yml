name: Bootstrap Duevio site

on:
  push:
    paths:
      - 'site.xz.ready'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify site files
        shell: bash
        run: |
          set -euo pipefail
          test -f site.xz.ready
          cat site.xz.chunk.* > site.tar.xz.b64
          base64 --decode site.tar.xz.b64 > site.tar.xz
          echo '393468276dc62f329e8faa970d33c6fdf12b4b563ba9c8e67f29a267ab07c3de  site.tar.xz' | sha256sum -c -
          xz -dc site.tar.xz | tar -xf -
          test -f index.html
          test -f assets/css/styles.css
          test -f assets/js/app.js
          test -f assets/i18n/en.json
          test -f assets/i18n/it.json
          test -f assets/i18n/de.json
          test -f assets/i18n/es.json
          test -f assets/i18n/fr.json
          test -f assets/i18n/ru.json
          test -f it/index.html
          test -f de/index.html
          test -f es/index.html
          test -f fr/index.html
          test -f ru/index.html
          rm -f site.tar.xz site.tar.xz.b64 site.xz.chunk.* site.xz.part.* site.xz.ready site.part.* site.ready
      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Duevio Site Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build multilingual Duevio website"
          git push
